# CMU Statistical Genomics -- https://cmustatgen.github.io/
# Served at the ROOT of an org user-site, so baseurl is empty.

title:       "CMU StatGen reading Group"
description: "Reading group on statistical genetics and genomics at Carnegie Mellon University"
url:         "https://cmustatgen.github.io"
baseurl:     ""

source:      .
destination: ./_site

# Built by GitHub Actions with real Jekyll 4.3, so plugins are not restricted
# to the Pages allowlist.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: feed.xml

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts/
  - vendor/
  - .bundle/
  - build/

sass:
  style: compressed
