# CMU Statistical Genomics -- https://cmustatgen.github.io/
# Served at the ROOT of an org user-site, so baseurl is empty.

title:       "CMU StatGen reading Group"
description: "Reading group on statistical genetics and genomics at Carnegie Mellon University"
url:         "https://cmustatgen.github.io"
baseurl:     ""

# Public Google Calendar for the meetings. The calendar ID is the address
# shown under "Integrate calendar" in Google Calendar settings, e.g.
# "abc123@group.calendar.google.com". Leave empty to hide the button.
google_calendar_id: "c_665177a3800956737f56164802463112d84fdfd2af175e38b9e22aec6142c87d@group.calendar.google.com"

source:      .
destination: ./_site

# Built by GitHub Actions with real Jekyll 4.3, so plugins are not restricted
# to the Pages allowlist.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: feed.xml

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts/
  - vendor/
  - .bundle/
  - build/

sass:
  style: compressed
