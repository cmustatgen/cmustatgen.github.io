# Pages' built-in builder is Jekyll 3.10 with a fixed plugin allowlist; this
# site targets 4.x, so we build it ourselves and upload the artifact.

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - uses: actions/configure-pages@v5

      - name: Build
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      - name: Every page renders
        run: |
          set -e
          for p in index.html archive/index.html people/index.html 404.html; do
            [ -s "_site/$p" ] || { echo "::error::missing or empty: _site/$p"; exit 1; }
          done

      - name: Colour tokens hold contrast in both themes
        run: python3 scripts/check_theme_contrast.py

      - name: Internal links and anchors
        run: |
          gem install html-proofer -v '~> 5.0' --no-document
          # External links are not checked: a speaker's homepage going down
          # should not block a deploy.
          htmlproofer ./_site \
            --disable-external \
            --check-internal-hash \
            --allow-hash-href \
            --no-enforce-https

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
