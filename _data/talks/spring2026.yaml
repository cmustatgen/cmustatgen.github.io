# Spring 2026 -- one entry per meeting, in date order. See fall2026.yaml for the
# field reference.

- date: '2026-02-06'
  speakers: [rebecca_farina]
  title: "Biophysical Bayesian inference for neurodegenerative dynamics: a multi-temporal framework"
  abstract: >-
    Understanding disease progression from molecular data often requires aligning individuals along
    a latent pseudotemporal axis. The B-BIND framework introduced a biophysically motivated Bayesian
    model for inferring such pseudotime from cross-sectional snapshots of Alzheimer's pathology
    (Agrawal et al., 2024). However, its current formulation assumes a single shared pseudotemporal
    trajectory across all measured features, limiting its ability to capture heterogeneous
    progression patterns across biomarkers.
    We extend B-BIND to allow multiple feature-specific pseudotimes, enabling flexible modeling of
    diverse temporal dynamics across molecular markers. Our approach introduces a hierarchical
    Bayesian model that clusters features according to shared progression behavior while jointly
    inferring a global donor ordering and cluster-specific trajectories. This is accomplished
    through a novel computational strategy that solves a relaxed permutation problem within the
    Bayesian framework, enforcing partial sharing of pseudotime orderings across features while
    permitting structured deviations between clusters.
    Through simulation studies and applications to Alzheimer's pathology data from both the Seattle
    Alzheimer's Disease Brain Cell Atlas and the ROSMAP cohort, we demonstrate improved
    identifiability of progression signals, more accurate donor alignment, and more interpretable
    clustering of features. Notably, the inferred donor orderings exhibit stronger correlation with
    classical neuropathological staging systems such as Braak and Thal scores, highlighting the
    model's ability to better integrate heterogeneous molecular features into a coherent disease
    progression map. Together, these advances provide a richer and more data-driven framework for
    characterizing neurodegenerative dynamics across diverse molecular readouts.
  paper_url: https://www.biorxiv.org/content/10.64898/2026.05.27.728207v2
- date: '2026-02-20'
  speakers: [ziqi_liu]
  title: Representation learning with blockwise missingness and signal heterogeneity
  abstract: >-
    Unified representation learning for multi-source data integration faces two important
    challenges: blockwise missingness and blockwise signal heterogeneity. The former arises from
    sources observing different, yet potentially overlapping, feature sets, while the latter
    involves varying signal strengths across subject groups and feature sets. While existing
    methods perform well with fully observed data or uniform signal strength, their performance
    degenerates when these two challenges coincide, which is common in practice. To address this,
    we propose Anchor Projected Principal Component Analysis (APPCA), a general framework for
    representation learning with structured blockwise missingness that is robust to signal
    heterogeneity. APPCA first recovers robust group-specific column spaces using all observed
    feature sets, and then aligns them by projecting shared "anchor" features onto these subspaces
    before performing PCA. This projection step induces a significant denoising effect. We
    establish estimation error bounds for embedding reconstruction through a fine-grained
    perturbation analysis. In particular, using a novel spectral slicing technique, our bound
    eliminates the standard dependency on the signal strength of subject embeddings, relying
    instead solely on the signal strength of integrated feature sets. We validate the proposed
    method through extensive simulation studies and an application to multimodal single-cell
    sequencing data.
  paper_url: https://arxiv.org/abs/2602.11511
- date: '2026-03-20'
  speakers: [lorenzo_testa]
  title: Post-imputation inference for spatial transcriptomics data
  abstract: >-
    The rapid development of spatial transcriptomics (ST) has provided unprecedented opportunities
    to explore tissue architectures. However, many high-resolution techniques are constrained by
    small gene panels, often capturing only a fraction of the transcriptome. This high degree of
    missingness, where the majority of genes remain undetected, limits the application value of ST
    data for comprehensive biological discovery. While deep learning frameworks now allow for the
    spatial reconstruction of these missing genes, downstream statistical inference (such as
    spatial differential gene expression testing) on imputed values remains unreliable due to
    unaddressed prediction uncertainty. To address this challenge, we develop Doubly-Debiased
    Spatially Permuted Inference (DDSPI), a novel framework designed for valid post-imputation
    inference. DDSPI employs a two-stage debiasing strategy. First, we construct debiased
    pseudo-outcomes by leveraging the predictive performance of a "neighborhood" of highly
    correlated observed genes. Then, to account for spatial autocorrelation, we implement a
    "whitening" procedure using nonparametric regression residuals, effectively isolating the
    biological signal from spatial trends. Significance is then assessed via a novel
    spatially-aware permutation testing strategy that utilizes treatment mask rolling to preserve
    the underlying spatial structure. We demonstrate the effectiveness of DDSPI by conducting
    extensive simulations, where our method maintains stable error control across multiple
    scenarios where other methods fail. Furthermore, we apply DDSPI to mouse brain and human breast
    cancer ST data, identifying biologically meaningful differentially expressed genes that were
    otherwise obscured in non-debiased analyses. Our approach provides a rigorous foundation for
    moving beyond mere prediction to valid discovery in spatial omics.
