# Fall 2025 -- one entry per meeting, in date order. See fall2026.yaml for the
# field reference.

- date: '2025-09-12'
  speakers: [lujing_zhang]
  title: "LIKA: likelihood-based inference of kinase activity from phosphoproteomic data"
  abstract: >-
    Directed networks abound in biology. Metabolic, gene regulatory, neurocircuitry cell signaling,
    and post-translational modifications of proteins are examples of directed networks. Statistical
    inference about perturbations of portions of directed networks, therefore, can be a useful tool
    for understanding various aspects of biology, including human diseases such as cancer. For
    instance, many cancers originate from perturbation of master kinases, which disrupt the function
    of numerous downstream proteins by alteration of their natural phosphorylation levels. We
    present LIKA, a likelihood-based graphical framework for inferring kinase activity from
    phosphoproteomic data. By modeling the many-to-many structure of kinase-substrate interactions,
    LIKA achieves high efficiency with limited data while capturing network complexity.
    Applications to schizophrenia and cell line datasets reveal novel dysregulated kinases, with
    simulations confirming robustness and accuracy.
- date: '2025-09-25'
  speakers: [lorenzo_testa]
  title: "Rescuing double robustness: safe estimation under complete misspecification"
  abstract: >-
    Double robustness is a major selling point of semiparametric and missing data methodology. Its
    virtues lie in protection against partial nuisance misspecification and asymptotic
    semiparametric efficiency under correct nuisance specification. However, in applications,
    complete nuisance misspecification should be regarded as the norm (or at the very least the
    expected default), and thus doubly robust estimators may behave fragilely. In fact, it has been
    amply verified empirically that these estimators can perform poorly when all nuisance functions
    are misspecified. Here, we first characterize this phenomenon of double fragility, and then
    propose a solution based on adaptive correction clipping (DR+ACC). We argue that our DR+ACC
    proposal is safe, in that it inherits the favorable properties of doubly robust estimators under
    correct nuisance specification, but its error is guaranteed to be bounded by a convex
    combination of the individual nuisance model errors, which prevents the instability caused by
    the compounding product of errors of doubly robust estimators. We also show that our proposal
    provides valid inference through the parametric bootstrap when nuisances are well-specified. We
    showcase the efficacy of our DR+ACC estimator both through extensive simulations and by applying
    it to the analysis of Alzheimer's disease proteomics data.
  paper_url: https://arxiv.org/abs/2509.22446
- date: '2025-10-10'
  speakers: [ergan_shang]
  title: "Predicting the unseen: a diffusion-based debiasing framework for transcriptional response prediction at single-cell resolution"
  abstract: >-
    Understanding how cells respond to perturbations of genes is central to uncovering the rules of
    gene regulation. Single-cell RNA sequencing combined with CRISPR-based perturbations has
    transformed this effort, but large-scale experiments remain costly and difficult to perform. Our
    work introduces dbDiffusion, a computational framework that can reliably predict how cells would
    respond to genetic perturbations that were never experimentally performed. By learning patterns
    from existing data, dbDiffusion extends the reach of perturbation experiments, enabling
    discoveries such as identifying genes that change their activity under specific conditions. This
    approach reduces experimental burden while expanding our ability to probe cellular function,
    offering a powerful complement to modern functional genomics.
  paper_url: https://www.pnas.org/doi/10.1073/pnas.2525268122
- date: '2025-10-24'
  speakers: [catherine_wang]
  title: "Robust empirical Bayes confidence intervals, with an eye to scCRISPR screens"
  abstract: >-
    This week I will talk about Empirical Bayes and how we may apply it to scCRISPR screens where
    there are multi-level treatments and multivariate outcomes. Mainly, I'll provide some
    background about Empirical Bayes estimators and discuss the paper "Robust Empirical Bayes
    Confidence Intervals" (Armstrong, Kolesar, Plagborg-Moller, 2022). The authors consider the
    normal means problem, where the goal is to estimate parameters θi when we observe
    Yi ~ N(θi, σ²). The confidence intervals constructed from parametric empirical Bayes, which
    assume a normal prior for θi, may substantially undercover when this prior is not true.
    Instead, the authors construct confidence intervals for a more general setting with assumptions
    only about the moments of the prior distribution. Lastly, I'll briefly talk about our project
    analyzing multi-level treatments with multivariate outcomes. scCRISPR screens test many
    perturbations (treatments) against many genes (outcomes). This generates many tests, so it may
    be helpful to share information across both perturbations and genes to improve estimation
    overall. I'll talk about how we might try to use empirical Bayes in this setting and share some
    preliminary results.
  paper_url: http://arxiv.org/abs/2004.03448
- date: '2025-11-07'
  speakers: [qi_xu]
  title: Every Row, Every Column, All at Once
  abstract: >-
    In this talk, I will introduce a setting we call block-wise missingness, a structure that often
    arises when integrating data from multiple sources or modalities, such as electronic health
    records, single-cell sequencing, and longitudinal studies. We study parameter estimation and
    inference under this structure. Our approach, grounded in semiparametric theory and inspired by
    prediction-powered inference, leverages off-the-shelf AI models (predictive or generative) to
    handle missing completely at random mechanisms. The key idea is to approximate the optimal
    estimating equation through a novel and tractable Restricted ANOVA HierarchY (RAY)
    approximation. The resulting estimator, Inference for Blockwise Missingness IBM(RAY),
    incorporates pretrained AI models while carefully controlling asymptotic variance via
    model-specific tuning. We further extend IBM(RAY) to a broader family of estimators and derive
    the most efficient member of this class, IBM(Adaptive), by solving a constrained quadratic
    optimization problem. All IBM estimators are unbiased and, importantly, asymptotically
    guarantee efficiency gains over naive complete-case estimators, regardless of the predictive
    accuracy of the AI models used. We demonstrate their finite-sample performance and numerical
    stability through simulation studies and an application to surface protein abundance
    estimation. Finally, I will briefly discuss open challenges in handling block-wise missingness
    and recent progress in nonparametric estimation and generative modeling under this framework.
