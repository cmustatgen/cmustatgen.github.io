- date: '2026-09-11'
  speakers: [alice_zhang]
  title: Contrastive Probabilistic CCA for Multi-Omics Data Analysis
  abstract: >-
    High-dimensional multi-view data often contain both shared and view-specific sources of
    variation, making it challenging to identify relationships that are specific to a condition of
    interest. Canonical correlation analysis (CCA) provides a framework for identifying
    low-dimensional representations that capture shared variations between two sets of measurements
    collected from the same samples. In contrastive analysis, data from a condition of interest
    (foreground) are analyzed alongside background samples to identify sources of variation specific
    to the foreground condition. However, when foreground data is analyzed with background samples,
    standard CCA does not separate shared variation that is present across conditions from
    cross-modal variation that is specific to the foreground.
    We propose a probabilistic contrastive extension of CCA (pcCCA) that uses these background and
    foreground samples to distinguish shared variation from cross-modal contrastive variation
    specific to the foreground. The model represents these sources of variation through
    low-dimensional latent variables, providing a probabilistic framework for their estimation. We
    motivate this framework using paired gene expression and protein abundance data and evaluate its
    ability to recover the underlying latent structure through simulation studies. The proposed
    pcCCA framework provides an approach for identifying cross-modal relationships specific to a
    condition while accounting for shared structure present in the background population.
- date: '2026-09-25'
  speakers: [lorenzo_testa]
  title: Accurate prediction in reconstructed spatial transcriptomes does not ensure valid biological discovery
  abstract: >-
    Spatial transcriptomics is increasingly extended by computational reconstruction of unmeasured
    genes from matched single-cell RNA-sequencing references, enabling transcriptome-wide analyses
    from targeted or sparse assays. Yet downstream analyses typically treat reconstructed expression
    as experimentally observed, overlooking prediction error and latent spatial variation that can
    misattribute tissue architecture to biological regulation. Here we introduce TIDEST, a framework
    for statistically valid inference on reconstructed spatial transcriptomes. TIDEST calibrates
    reconstructed expression using measured genes and adjusts for latent spatial variation before
    differential expression analysis. Across realistic spatial tissue simulations, TIDEST controls
    false discoveries where existing approaches fail, while preserving power. Across mouse brain and
    human breast cancer, TIDEST changes biological interpretation by correcting misleading
    differential-expression calls and revealing disease-associated transcriptional programs obscured
    by spatial confounding. Our results show that prediction accuracy alone is insufficient for
    reliable biological discovery and establish valid statistical inference as an essential
    component of reconstructed spatial transcriptomics.
  paper_url: https://www.biorxiv.org/content/10.64898/2026.06.19.733432v2
- date: '2026-10-09'
  speakers: [ergan_shang]
  title: Predicting Single-Cell Perturbation Responses in New Contexts with SCARF
  abstract: >-
    Predicting cellular responses to external interventions is fundamental for understanding gene
    regulation and accelerating therapeutic discovery. While recent advances in single-cell
    technologies have enabled large-scale profiling of perturbation effects, comprehensive
    experimental exploration remains constrained by cost and feasibility. This limitation motivates
    the development of computational approaches that can accurately infer responses to unmeasured
    perturbations across diverse cell types and cell lines using related experimental data. We
    propose SCARF, a deep generative framework that integrates optimal transport with
    transformer-based representation learning for accurate and generalizable prediction of
    single-cell perturbation responses. While transformer architectures were originally developed
    for processing token embeddings in large language models (LLMs), we adapt them here to refine
    cellular embeddings across varying perturbation conditions. Unlike many existing deep learning
    approaches, SCARF does not rely solely on large-scale foundation models, which have been shown
    to exhibit inconsistent performance in this setting. Instead, our framework leverages optimal
    transport to capture distributional shifts between perturbations and across cell lines,
    providing a principled mechanism for transferring perturbation effects. By combining
    transport-based alignment with transformer-driven refinement, SCARF learns biologically
    meaningful latent representations that generalize effectively to unseen cellular contexts.
    Experiments on multiple benchmark datasets demonstrate that SCARF outperforms on most evaluated
    metrics compared with existing methods in predicting gene expression responses under both
    unseen perturbations and cell lines.
- date: '2026-10-23'
  speakers: [julia_elrod]
  title: Benchmarking scRNA-seq normalization methods for accurate gene expression distribution recovery
  abstract: >-
    When choosing a sequencing method to quantify single-cell RNA expression, there is a tradeoff
    between throughput -- the number of cells sequenced -- and resolution -- the number of reads
    per cell. High-throughput technologies such as 10x Chromium are a popular choice because they
    can provide a more complete picture of the cell population of interest and allow for the
    detection of rare cell types. To overcome the lower resolution of these methods compared to
    higher-depth technologies such as Smart-seq3, many single-cell normalization methods have been
    introduced for the recovery of accurate gene expression distributions from 10x data. We have
    benchmarked a selection of approaches on multiple datasets, evaluating their ability to recover
    true expression distributions using total variation distance, squared Hellinger distance, and
    Kullback-Leibler divergence. We show that bayNorm has the most accurate recovery of gene
    expression distributions and recommend its use for single-cell normalization prior to
    log-transformation.
- date: '2026-11-06'
  speakers: [annaelaine_rosengart]
  title: Mapping transcriptional responses to cellular perturbations with RNA fingerprinting
  abstract: >-
    Single-cell perturbation dictionaries measure how cells respond to genetic and chemical
    perturbations, creating the opportunity to assign causal interpretations to observational
    data. We introduce RNA fingerprinting, a statistical framework that maps transcriptional
    responses from new experiments onto reference perturbation dictionaries. RNA fingerprinting
    learns perturbation representations, or "fingerprints," from single-cell data, then
    probabilistically assigns query cells to one or more candidate perturbations. We benchmark
    on ground-truth datasets, demonstrating accurate assignments at single-cell resolution,
    scalability to genome-wide screens, and the ability to resolve combinatorial perturbations.
    We demonstrate broad utility across diverse biological settings: identifying context-specific
    regulators of p53 under ribosomal stress, characterizing dose-dependent drug mechanisms of
    action, and uncovering cytokine-driven B cell heterogeneity during secondary influenza
    infection in vivo. Together, these results establish RNA fingerprinting as a versatile
    framework for interpreting single-cell datasets by linking cellular states to their
    underlying perturbations.
  paper_url: https://www.sciencedirect.com/science/article/pii/S0092867426011190
